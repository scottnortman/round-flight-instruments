[package]
name = "instrument-connector"
version = "0.2.0-test.13"
edition = "2021"
license = "Apache-2.0"

[dependencies]
aircraft-profiles = { path = "../../crates/aircraft-profiles" }
instrument-core = { path = "../../crates/instrument-core" }
connector-runtime = { path = "../../crates/connector-runtime" }
sim-bridge = { path = "../sim-bridge" }
simulator-link = { path = "../../crates/simulator-link" }
simconnect-native = { path = "../../crates/simconnect-native", optional = true }
serialport = { version = "4.10.1", default-features = false }
ctrlc = "3.5.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
msfs = ["sim-bridge/msfs", "dep:simconnect-native"]

[dev-dependencies]
text-cli = { path = "../../crates/text-cli" }
